# Example Lean MVP Compose — adapt image/build and service names.
# Secrets and env come from a private override generated by sync_config.py
# (docker compose -f docker-compose.prod.yml -f /opt/<PROJECT>-runtime/current.json).

services:
  api:
    build: .
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - "3000:3000"
    depends_on:
      - postgres
    restart: unless-stopped

  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: <DB_NAME>
      POSTGRES_USER: <DB_USER>
      # POSTGRES_PASSWORD injected via override from SSM SecureString
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    # Do NOT publish 5432 to the host in production.

volumes:
  postgres_data:
