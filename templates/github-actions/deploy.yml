name: Deploy to Production

on:
  push:
    branches: [<PRODUCTION_BRANCH>]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions: {}

jobs:
  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest
    environment: production
    if: github.ref == 'refs/heads/<PRODUCTION_BRANCH>'
    permissions:
      contents: read
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
    steps:
      - name: Deployment disabled
        if: vars.PRODUCTION_SSM_ENABLED != 'true'
        run: echo 'PRODUCTION_SSM_ENABLED is not true; skipping production deployment.'

      - name: Deploy via SSH
        if: vars.PRODUCTION_SSM_ENABLED == 'true'
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17 # v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER || 'ubuntu' }}
          key: ${{ secrets.EC2_SSH_KEY }}
          fingerprint: ${{ secrets.EC2_HOST_FINGERPRINT }}
          envs: AWS_REGION
          command_timeout: 45m
          script: |
            set -euo pipefail
            cd /opt/<PROJECT>-api
            test "$(git branch --show-current)" = '<PRODUCTION_BRANCH>'
            test -z "$(git status --porcelain --untracked-files=no)"
            git pull --ff-only origin <PRODUCTION_BRANCH>
            bash scripts/production/deploy.sh
