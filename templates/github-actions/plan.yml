name: Terraform plan (infra review)

on:
  pull_request:
    branches: [<PRODUCTION_BRANCH>]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  plan:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.10.5
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_CONFIG_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Init and plan production-config
        working-directory: infra/production-config
        run: |
          terraform init -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" -backend-config="region=${{ vars.AWS_REGION }}"
          terraform validate
          terraform plan -lock-timeout=60s
